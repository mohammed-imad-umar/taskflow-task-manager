{% extends "base.html" %}
{% block title %}{{ page_title }} · TaskFlow{% endblock %}
{% block breadcrumb %}{{ page_title }}{% endblock %}
{% block content %}
<section class="form-page">
  <a class="back-link" href="/">← &nbsp; Back to overview</a>
  <div class="form-heading"><div class="eyebrow">MAKE IT HAPPEN</div><h1>{{ page_title }}</h1><p class="subtitle">A little planning goes a long way. Add the details below.</p></div>
  <form class="task-form" action="{{ '/tasks/' ~ task.id ~ '/edit' if task else '/tasks' }}" method="post">
    <label for="title">Task title <span>*</span></label>
    <input id="title" name="title" type="text" maxlength="160" placeholder="e.g. Finish project documentation" value="{{ task.title if task else '' }}" required autofocus>
    <label for="description">Description <small>OPTIONAL</small></label>
    <textarea id="description" name="description" rows="5" placeholder="Add a few details to help you stay on track...">{{ task.description if task else '' }}</textarea>
    <div class="form-two">
      <div><label for="priority">Priority</label><select id="priority" name="priority"><option {{ 'selected' if task and task.priority == 'Low' else '' }}>Low</option><option {{ 'selected' if not task or task.priority == 'Medium' else '' }}>Medium</option><option {{ 'selected' if task and task.priority == 'High' else '' }}>High</option></select></div>
      <div><label for="due_date">Due date <small>OPTIONAL</small></label><input id="due_date" name="due_date" type="date" value="{{ task.due_date if task and task.due_date else '' }}"></div>
    </div>
    <div class="form-actions"><a class="secondary-btn" href="/">Cancel</a><button class="primary-btn" type="submit">{{ 'Save changes' if task else 'Create task' }} <span>→</span></button></div>
  </form>
</section>
{% endblock %}
